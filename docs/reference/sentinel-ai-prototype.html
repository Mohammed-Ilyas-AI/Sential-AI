<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENTINEL AI — Financial Crime Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Fallback tokens; the active tenant theme is applied from JS (THEMES) */
:root{
  --bg:#0C0809;--sf:#161012;--sf2:#1F1719;--ln:#33262A;--ink:#F6F0F1;--ink2:#C2B5B7;--ink3:#8C7F82;
  --ac:#E3122F;--acInk:#fff;--acSoft:rgba(227,18,47,.14);--ok:#2BC46A;--warn:#F5A524;--hi:#FB7A2E;--crit:#FF3D52;--info:#4C8DF6;
  --glow:rgba(227,18,47,.35);--shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:16px;--r-md:11px;--r-sm:8px;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0C0809;--sf:#161012;--ink:#F6F0F1}}
:root[data-theme="dark"]{--bg:#0C0809;--sf:#161012;--ink:#F6F0F1}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(var(--top) + 70px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  padding-top:var(--top);transition:background .25s,color .25s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
.m{font-family:var(--mono);font-feature-settings:"tnum"}
.muted{color:var(--ink3)} .ink2{color:var(--ink2)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.rail{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--ln);padding:10px 16px 10px}
.top .row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mk{width:34px;height:34px;flex:none}
.brand .nm{font-weight:700;font-size:17px;letter-spacing:.02em;line-height:1}
.brand .nm span{color:var(--ac)}
.brand .sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative;border:1px solid var(--ln);background:var(--sf)}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--ac);color:var(--acInk);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.top .row2{display:flex;gap:8px;margin-top:10px}
.tenantbtn{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--ln);border-radius:var(--r-md);background:var(--sf);text-align:left}
.tmark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.tenantbtn b{display:block;font-size:13.5px;line-height:1.1}
.tenantbtn small{display:block;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--ln);border-radius:var(--r-md);background:var(--sf);font-size:12px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.live b{font-family:var(--mono);font-weight:500;font-size:12px}
#view{flex:1;padding:14px 14px calc(96px + var(--bot));max-width:1240px;width:100%;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);
  background:color-mix(in srgb,var(--sf) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--ln);padding:6px 4px calc(6px + var(--bot))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;font-size:10.5px;color:var(--ink3);border-radius:10px;position:relative}
.tab svg{width:21px;height:21px}
.tab[aria-current="page"]{color:var(--ac);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-6px;left:28%;right:28%;height:2px;border-radius:2px;background:var(--ac)}
.tab .bdg{position:absolute;top:0;right:calc(50% - 20px);min-width:15px;height:15px;border-radius:8px;background:var(--ac);color:var(--acInk);font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}

@media (min-width:960px){
  .rail{display:flex;flex-direction:column;width:232px;flex:none;position:sticky;top:0;height:100vh;border-right:1px solid var(--ln);background:var(--sf);padding:18px 12px}
  .rail .brand{padding:0 6px 18px}
  .rail .nav{display:flex;flex-direction:column;gap:3px}
  .rail .nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink2);font-size:14px;text-align:left;position:relative}
  .rail .nav button:hover{background:var(--sf2)}
  .rail .nav button[aria-current="page"]{background:var(--acSoft);color:var(--ac);font-weight:600}
  .rail .nav .bdg{margin-left:auto;background:var(--ac);color:var(--acInk);font-size:11px;font-weight:700;border-radius:9px;padding:1px 7px}
  .rail .foot{margin-top:auto;font-size:11.5px;color:var(--ink3);padding:0 8px;line-height:1.5}
  .tabs{display:none}
  .top .brand{display:none}
  .top .row2{margin-top:0}
  .top{padding:12px 24px}
  .top .row{display:none}
  #view{padding:22px 24px 40px}
}

/* ---------- primitives ---------- */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow)}
.card+.card,.stack>*+*{margin-top:12px}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hd h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.005em}
.hd h2 small{font-weight:400;color:var(--ink3);font-size:12.5px;margin-left:4px}
.hd .aside{margin-left:auto;font-size:12px;color:var(--ink3)}
.link{color:var(--ac);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:3px}
h1.page{font-size:21px;margin:2px 0 2px;font-weight:600;letter-spacing:-.005em}
.pagehd{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.pagehd .sub{font-size:12.5px;color:var(--ink3)}
.back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln);background:var(--sf);flex:none}
.grid{display:grid;gap:12px}
@media (min-width:960px){.g2{grid-template-columns:1.25fr 1fr}.g2e{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--ln);background:var(--sf2);color:var(--ink);min-height:44px}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acInk)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--ln));background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.btn small{display:block;font-weight:400;font-size:10.5px;opacity:.8}
.btn .col{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.p-crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 13%,transparent);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.p-hi{color:var(--hi);background:color-mix(in srgb,var(--hi) 13%,transparent);border-color:color-mix(in srgb,var(--hi) 35%,transparent)}
.p-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.p-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.p-info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.p-mute{color:var(--ink2);background:var(--sf2);border-color:var(--ln)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 13px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-size:13px;color:var(--ink2);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--acInk);font-weight:600}
.seg button .n{font-family:var(--mono);font-size:11px;opacity:.85;border:1px solid currentColor;border-radius:5px;padding:0 4px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r-md);padding:11px 12px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink3)}
.kpi .v{font-size:24px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;margin-top:3px;line-height:1.1}
.kpi .v small{font-size:12px;color:var(--ink3);font-family:var(--sans);font-weight:400;margin-left:3px}
.kpi .d{font-size:11.5px;color:var(--ink3);margin-top:3px}
.empty{padding:22px 10px;text-align:center;color:var(--ink3);font-size:13px}
.empty .btn{margin-top:12px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.dl dt{color:var(--ink3)} .dl dd{margin:0;text-align:right;font-family:var(--mono);font-size:12.5px;word-break:break-word}
.hr{height:1px;background:var(--ln);margin:12px 0}
.note{font-size:12px;color:var(--ink3);line-height:1.5;margin:10px 0 0}

/* ---------- stream ---------- */
.stream{margin:0 -4px}
.srow{display:grid;grid-template-columns:62px 22px minmax(0,1fr) 78px 34px;align-items:center;gap:8px;padding:9px 6px;border-radius:9px;font-size:12.5px;cursor:pointer}
.srow:hover{background:var(--sf2)}
.srow .t{font-family:var(--mono);color:var(--ink3);font-size:11.5px}
.srow .who{font-family:var(--mono);font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .who .to{color:var(--ink3)}
.srow .am{font-family:var(--mono);text-align:right;font-size:12px}
.srow .st{grid-column:3/-1;font-size:10.5px;color:var(--ink3);margin-top:-5px}
.srow.held{background:color-mix(in srgb,var(--crit) 10%,transparent);box-shadow:inset 2px 0 0 var(--crit)}
.srow.fresh{animation:fresh .9s ease-out}
@keyframes fresh{from{background:color-mix(in srgb,var(--info) 16%,transparent)}}
.bk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff}
.rs{font-family:var(--mono);font-size:12px;font-weight:600;border-radius:6px;text-align:center;padding:2px 0;border:1px solid}
.rs.LOW{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.rs.ELEVATED{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.rs.HIGH{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 55%,transparent)}
.rs.CRITICAL{color:var(--crit);border-color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}
.shd{display:grid;grid-template-columns:62px 22px minmax(0,1fr) 78px 34px;gap:8px;padding:0 6px 6px;font-size:11px;color:var(--ink3);border-bottom:1px solid var(--ln);margin-bottom:4px}
.shd span:nth-child(4){text-align:right}

/* ---------- incident hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:16px;border:1px solid color-mix(in srgb,var(--crit) 55%,var(--ln));
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--crit) 22%,transparent),transparent 60%),var(--sf)}
.hero.calm{border-color:var(--ln);background:var(--sf)}
.hero .eyebrow{font-size:12px;color:var(--ink3)}
.hero h3{margin:3px 0 2px;font-size:19px;font-weight:600}
.hero p{margin:0;color:var(--ink2);font-size:13.5px}
.hero .row{display:flex;gap:14px;align-items:flex-end;margin-top:12px;flex-wrap:wrap}
.hero .score{font-family:var(--mono);font-size:40px;font-weight:600;line-height:.9;color:var(--crit)}
.hero .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .acts .btn{flex:1 1 150px}

/* ---------- policy gate (the one bold element) ---------- */
.gate{position:relative;border-radius:18px;padding:16px;border:1px solid var(--ln);background:var(--sf2);overflow:hidden}
.gate.hold{border-color:var(--crit);background:
  radial-gradient(90% 120% at 0% 0%,color-mix(in srgb,var(--crit) 26%,transparent),transparent 62%),
  linear-gradient(180deg,color-mix(in srgb,var(--crit) 9%,var(--sf)),var(--sf));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--crit) 30%,transparent),0 14px 40px -18px var(--glow)}
.gate.arm{animation:arm 1.6s ease-out 1}
@keyframes arm{0%{transform:scale(.985);box-shadow:0 0 0 0 var(--glow)}40%{box-shadow:0 0 0 14px transparent}100%{transform:none}}
.gate .cap{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink3)}
.gate.hold .cap{color:color-mix(in srgb,var(--crit) 80%,var(--ink))}
.gate .cap .pill{margin-left:auto}
.gate .state{font-size:30px;font-weight:700;letter-spacing:.01em;margin:6px 0 4px;display:flex;align-items:center;gap:10px;line-height:1.05}
.gate.hold .state{color:var(--crit)}
.gate .state .lk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,currentColor 16%,transparent);flex:none}
.gate .why{font-size:13.5px;color:var(--ink2)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px;margin-top:12px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--ink3) 25%,transparent)}
@media (min-width:520px){.facts{grid-template-columns:repeat(4,1fr)}}
.facts div{font-size:11.5px;color:var(--ink3)}
.facts b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:500;margin-top:2px}
.meter{margin-top:12px}
.meter .track{position:relative;height:10px;border-radius:6px;background:color-mix(in srgb,var(--ink3) 22%,transparent);overflow:visible}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--ok);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter .fill.near{background:var(--warn)} .meter .fill.over{background:linear-gradient(90deg,var(--hi),var(--crit))}
.meter .thr{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.meter .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:6px;font-family:var(--mono)}

/* ---------- contributions ---------- */
.contrib{display:flex;flex-direction:column;gap:2px}
.crow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 4px;border-radius:10px;text-align:left;width:100%}
.crow:hover{background:var(--sf2)}
.crow .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--sf2);border:1px solid var(--ln)}
.crow .lb{font-size:13.5px;font-weight:500}
.crow .dt{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .bar{height:4px;border-radius:3px;background:color-mix(in srgb,var(--ink3) 20%,transparent);margin-top:5px;overflow:hidden}
.crow .bar i{display:block;height:100%;border-radius:3px}
.crow .pts{font-family:var(--mono);font-size:15px;font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 0;border-top:1px solid var(--ln);margin-top:6px;font-size:12.5px;color:var(--ink3)}
.total b{font-family:var(--mono);font-size:22px;color:var(--ink)}

/* ---------- decision trace stepper ---------- */
.trace{display:flex;gap:0;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:thin}
.tstep{flex:1 0 108px;text-align:center;position:relative;font-size:11.5px;color:var(--ink3);padding:0 4px}
.tstep::after{content:"";position:absolute;top:19px;left:calc(50% + 22px);right:calc(-50% + 22px);height:1px;background:var(--ln)}
.tstep:last-child::after{display:none}
.tstep .o{width:38px;height:38px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;border:1px solid var(--ln);background:var(--sf2);color:var(--ink2)}
.tstep.hot .o{background:var(--crit);border-color:var(--crit);color:#fff;box-shadow:0 0 16px -2px var(--glow)}
.tstep.done .o{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--ln))}
.tstep b{display:block;color:var(--ink);font-size:12px;font-weight:600}
.tstep .v{font-family:var(--mono);font-size:11px}
.noai{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 11px;border-radius:10px;border:1px solid color-mix(in srgb,var(--ok) 35%,var(--ln));background:color-mix(in srgb,var(--ok) 8%,transparent);font-size:12.5px}
.noai b{color:var(--ok)}

/* ---------- action bar ---------- */
.actbar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:640px){.actbar{grid-template-columns:repeat(4,1fr)}}
.actbar .btn{padding:10px 10px;font-size:13.5px}
.lockline{font-size:12px;color:var(--ink3);margin-top:9px;display:flex;gap:7px;align-items:flex-start}
.lockline b{color:var(--warn);font-weight:600}
.restrict{margin-top:10px;padding:10px 12px;border:1px dashed var(--ln);border-radius:10px;font-size:12.5px;color:var(--ink3)}

/* ---------- json / code ---------- */
details.json{border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
details.json summary{list-style:none;padding:12px 14px;display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:600;font-size:14px}
details.json summary::-webkit-details-marker{display:none}
details.json summary .aside{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink3);font-family:var(--mono)}
details.json[open] summary{border-bottom:1px solid var(--ln)}
.jcols{display:grid;gap:10px;padding:12px}
@media (min-width:720px){.jcols{grid-template-columns:1fr 1fr}}
.jcols .cap{font-size:11.5px;color:var(--ink3);margin-bottom:5px}
pre.code{margin:0;font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--ink2);background:var(--sf2);border:1px solid var(--ln);border-radius:9px;padding:10px 11px;overflow:auto;max-height:280px;white-space:pre}
pre.code .k{color:var(--ink3)} pre.code .s{color:var(--ok)} pre.code .n{color:var(--warn)} pre.code .h{color:var(--crit);font-weight:600} pre.code .a{color:var(--ok);font-weight:600}
.jnote{padding:0 12px 12px;font-size:12px;color:var(--ink2);line-height:1.55}

/* ---------- simulator ---------- */
.scen{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media (min-width:720px){.scen{grid-template-columns:repeat(4,1fr)}}
.scard{text-align:left;padding:12px;border-radius:13px;border:1px solid var(--ln);background:var(--sf);display:flex;flex-direction:column;gap:6px;min-height:112px}
.scard .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sf2);color:var(--ac)}
.scard b{font-size:14px} .scard span{font-size:12px;color:var(--ink3);line-height:1.35}

/* ---------------- rule engine (deterministic) ---------------- */
const RULES=[
 {code:"RAPID_DRAIN",label:"Rapid account depletion",icon:"bars",max:30,fn:c=>{
   if(!c.isProtected||c.drainPct<=FLOOR_PCT) return null;
   const p=clamp(Math.round((c.drainPct-FLOOR_PCT)/(GATE_PCT-FLOOR_PCT)*30),0,30);
   return p?{points:p,detail:c.drainPct.toFixed(1)+"% of opening balance in 24h"}:null}},
 {code:"NEW_DEVICE",label:"New device",icon:"device",max:21,fn:c=>c.newDeviceHrs==null||c.newDeviceHrs>=24?null:{points:21,detail:c.deviceId+", first seen "+Math.max(1,Math.round(c.newDeviceHrs*60))+" min ago"}},
 {code:"NEW_PAYEE",label:"New beneficiary",icon:"userplus",max:16,fn:c=>{
   if(c.payeeAgeHrs==null) return null;
   if(c.payeeAgeHrs<24) return {points:16,detail:c.payeeId+", added "+age(c.payeeAgeHrs)+" ago"};
   if(c.payeeAgeHrs<168) return {points:8,detail:c.payeeId+", added "+age(c.payeeAgeHrs)+" ago"};
   return null}},
 {code:"VELOCITY",label:"Transaction velocity",icon:"bolt",max:12,fn:c=>{
   if(c.velocityRatio<=VEL_BASE) return null;
   const p=clamp(Math.round((c.velocityRatio-VEL_BASE)*6),0,12);
   return p?{points:p,detail:c.velocityRatio.toFixed(1)+"× account baseline"}:null}},
 {code:"ENTITY_LINK",label:"Suspicious entity relationship",icon:"link",max:9,fn:c=>{
   const links=c.flaggedLinks||[]; if(!links.length) return null;
   let pts=0,conf=0,tokn=0,cand=0;
   links.forEach(l=>{const w=LINK_W[l]||0;pts+=w;if(w===3)conf++;else if(w===2)tokn++;else cand++});
   pts=clamp(pts,0,9); if(!pts) return null;
   return {points:pts,detail:(conf?conf+" flagged via confirmed links":"")+(tokn?(conf?", ":"")+tokn+" via network device token":"")+(cand?", "+cand+" candidate not scored":"")}}},
 {code:"BEHAVIOUR_DEV",label:"Behavioural deviation",icon:"wave",max:7,fn:c=>{
   if(!c.amount||c.amount<=P95) return null;
   const p=clamp(Math.round((c.amount-P95)/P95*7),0,7);
   return p?{points:p,detail:SGD(c.amount)+", above the 95th percentile of "+SGD(P95)}:null}},
 {code:"COOLING_OFF",label:"Cooling-off period active",icon:"clock",max:5,fn:c=>c.coolingOff?{points:5,detail:"high-risk account change within 12h"}:null}
];
function age(h){return h<1?Math.max(0,Math.round(h*60))+" min":h<24?Math.round(h)+" h":Math.round(h/24)+" d"}
function band(score){return score>=85?"CRITICAL":score>=65?"HIGH":score>=40?"ELEVATED":"LOW"}
function assess(ctx){
  const c=Object.assign({},ctx);
  c.isProtected=c.balanceAtWindowStart>=PROTECTED_BALANCE;
  c.drainPct=c.balanceAtWindowStart>0?(c.outflow24h/c.balanceAtWindowStart)*100:0;
  const contributions=[];
  RULES.forEach(r=>{const x=r.fn(c); if(x&&x.points>0) contributions.push({code:r.code,label:r.label,icon:r.icon,max:r.max,points:x.points,detail:x.detail})});
  contributions.sort((a,b)=>b.points-a.points);
  const score=clamp(contributions.reduce((s,x)=>s+x.points,0),0,100);
  let gate;
  if(!c.isProtected) gate={state:"NOT PROTECTED",hold:false,why:"Opening balance "+SGD(c.balanceAtWindowStart)+" is below the "+SGD(PROTECTED_BALANCE)+" protected threshold, so the rapid-drain safeguard does not apply."};
  else if(c.drainPct>GATE_PCT) gate={state:"HOLD ACTIVE",hold:true,why:c.drainPct.toFixed(1)+"% exceeds the 50% gate — this and subsequent outflows held for 24 hours."};
  else gate={state:"GATE NOT MET",hold:false,why:c.drainPct.toFixed(1)+"% is at or below the 50% gate — no policy action is mandated."};
  const b=band(score);
  const handling=gate.hold?"Policy hold":b==="CRITICAL"||b==="HIGH"?"Review required":b==="ELEVATED"?"Monitor":"No action";
  return {score,band:b,contributions,gate,handling,drainPct:c.drainPct,isProtected:c.isProtected,
    balance:c.balanceAtWindowStart,outflow:c.outflow24h,ctx:c};
}
const bandCls=b=>b==="CRITICAL"?"p-crit":b==="HIGH"?"p-hi":b==="ELEVATED"?"p-warn":"p-ok";
const bandVar=b=>b==="CRITICAL"?"var(--crit)":b==="HIGH"?"var(--hi)":b==="ELEVATED"?"var(--warn)":"var(--ok)";

function decide(ev,a,caseId){
  S.decisions++; const n=String(93800+S.decisions), hold=a.gate.hold;
  const res={decisionId:"DEC-"+n,tenantId:ev.tenantId,transactionId:ev.transactionId,idempotencyKey:ev.idempotencyKey,
    decision:hold?"HOLD":"ALLOW",riskScore:a.score,policyCodes:hold?["RAPID_DRAIN"]:[],
    reasonCodes:hold?["SG-RD-50_THRESHOLD_EXCEEDED"]:[a.isProtected?"SG-RD-50_GATE_NOT_MET":"NOT_PROTECTED_BALANCE"],
    assessmentId:"ASM-"+n,rulesetVersion:RULESET,policyVersion:POLICYV};
  if(hold){res.caseId=caseId;res.holdUntil=isoNow(24)}
  res.decidedAt=isoNow(); res.expiresAt=isoNow(1/12); res.traceId="TRACE-"+tok("t",ev.transactionId).slice(-8);
  const lat=Math.round(22+lrnd()*24); S.lats.push(lat); if(S.lats.length>400) S.lats.shift();

}

    se("PAYEE_ADDED","Beneficiary <b>PAYEE-6613</b> created",{payeeId:"PAYEE-6613",payeeAgeHrs:2},500,{beneficiaryToken:tok("ben","PAYEE-6613")});
    const ps=["PAYEE-6613","PAYEE-2251","PAYEE-6613","PAYEE-4417","PAYEE-6613","PAYEE-2251","PAYEE-6613","PAYEE-4417"];
    ps.forEach((p,i)=>tx("Small transfer to "+p,p,i%2?o1:t,amt(110000+((i*37)%5)*6000),Object.assign({velocityRatio:+(1.4+i*0.5).toFixed(1),payeeId:p},i===7?{flaggedLinks:["NETWORK_TOKEN","CORRELATED"]}:{}),650));
  } else {

    se("NEW_DEVICE","Login from unseen device <b>DEV-a4d2</b> (new country)",{newDeviceHrs:0.2,deviceId:"DEV-a4d2"},1000,{deviceToken:tok("dev","DEV-a4d2")});
    se("PAYEE_ADDED","Beneficiary <b>PAYEE-8830</b> created",{payeeId:"PAYEE-8830",payeeAgeHrs:0.02},1000,{beneficiaryToken:tok("ben","PAYEE-8830")});
    tx("Transfer to PAYEE-8830","PAYEE-8830",o1,amt(1800000),{velocityRatio:2,payeeId:"PAYEE-8830"},1200);
  }
  if(opts.notify) po("Customer notification <b>sent</b>",600);
  po("Audit event <b>recorded</b>",400);
  return {key,acct,inst:t,o1,o2,base,steps:L};
}
/* Deterministic dry run: the preview is the engine, not a guess */
function dryRun(key,t,opts){
  const sc=buildScenario(key,t,opts), ctx=Object.assign({},sc.base); let hold=false, a=assess(ctx), holdStep=-1, held=0;
  sc.steps.forEach((s,i)=>{
    if(s.kind==="sec") Object.assign(ctx,s.patch);
    if(s.kind==="tx"){
      if(hold){held+=s.amt;return}
      Object.assign(ctx,s.patch,{amount:s.amt,outflow24h:ctx.outflow24h+s.amt});
      a=assess(ctx); if(a.gate.hold){hold=true;holdStep=i;held+=s.amt}
    }
  });
  return {sc,a,holdStep,held};
}

function newIncident(sc){
  const n=S.incidentOrder.length+1;
  const inc={id:"INC-"+String(4400+n),txn:"TXN-"+dateTag()+"-"+(7720+n),scenario:sc.key,acct:sc.acct,inst:sc.inst,o1:sc.o1,o2:sc.o2,
    ctx:Object.assign({},sc.base),timeline:[],traj:[],txs:[],sec:[],last:null,lastSec:null,dupNote:null,lifeNote:null,
    status:"LIVE",hold:false,holdAt:null,holdStep:null,heldValue:0,verify:null,caseId:null,ai:null,createdAt:stamp(),gateAt:null,notified:false};
  inc.traj.push(assess(inc.ctx).score);
  S.incidents[inc.id]=inc; S.incidentOrder.unshift(inc.id);
  return inc;
}
const incAssess=inc=>assess(inc.ctx);
const activeHolds=()=>S.incidentOrder.map(id=>S.incidents[id]).filter(i=>i&&i.status==="HOLD");
const openIncidents=()=>S.incidentOrder.map(id=>S.incidents[id]).filter(i=>i&&["LIVE","HOLD","REVIEW","MONITOR"].includes(i.status));
function tl(inc,kind,html,code){inc.timeline.push({t:stamp(),kind,html,code:code||null})}

function runSimulation(){
  if(S.running) return;
  const {scenario,speed,opts}=S.sim, sc=buildScenario(scenario,S.tenant,opts), inc=newIncident(sc);
  S.running={id:inc.id,fast:speed>=5};
  inc.caseRef="CASE-2026-00"+(17+S.caseOrder.filter(c=>!S.cases[c].seed).length);
  audit("SYSTEM","scenario "+SCENARIOS[scenario].name+" armed on "+inc.acct+" ("+TENANTS[inc.inst].name+")",inc.id);
  tl(inc,"base","Baseline — <b>"+inc.acct+"</b> nominal");
  go("#/tower");
  let delay=0;
  sc.steps.forEach((st,i)=>{
    delay+=reduced?120:st.ms/speed;
    timers.push(setTimeout(()=>runStep(inc,st,i,sc.steps.length),delay));
  });
}
let timers=[];
function runStep(inc,st,i,total){
  if(st.kind==="sec"){
    Object.assign(inc.ctx,st.patch);
    const ev=Object.assign({schemaVersion:"1.0",tenantId:"BANK_"+inc.inst,eventId:"SEC-"+(510000+S.seqN+i),idempotencyKey:"idem-SEC-"+(510000+S.seqN+i),
      accountToken:tok("acct",inc.acct),eventType:st.type,occurredAt:isoNow()},st.extra||{});
    inc.sec.push(ev); inc.lastSec=ev;
    tl(inc,"sec",st.label,st.type==="NEW_DEVICE"?"NEW_DEVICE":st.type==="PAYEE_ADDED"?"NEW_PAYEE":"COOLING_OFF");
    audit("SYSTEM","security event "+st.type+" ingested for "+inc.acct+" — account state updated",inc.id);
    pushStream({t:stamp(),src:inc.acct,inst:inc.inst,dst:st.type.replace(/_/g," ").toLowerCase(),amt:0,score:incAssess(inc).score,band:incAssess(inc).band,status:"SECURITY",mode:"security event",inc:inc.id});
  } else if(st.kind==="in"){
    tl(inc,"tx",st.label);
  } else if(st.kind==="tx"){
    if(inc.hold){
      inc.heldValue+=st.amt;
      const a=incAssess(inc);
      const ev=txEvent(inc.acct,inc.inst,st.to,st.toInst,st.amt,"PENDING",{device:inc.ctx.deviceId});
      const d=decide(ev,a,inc.caseRef); inc.last={req:ev,res:d.res,lat:d.lat};
      inc.txs.push({id:ev.transactionId,to:st.to,toInst:st.toInst,amt:st.amt,status:"HELD",t:stamp()});
      tl(inc,"hold","Further transfer <b>"+SGD(st.amt)+"</b> to "+st.to+" — held under the active hold","RAPID_DRAIN");
      pushStream({t:stamp(),src:inc.acct,inst:inc.inst,dst:st.to,amt:st.amt,score:a.score,band:a.band,status:"HELD",mode:"decision API",inc:inc.id});
    } else {
      Object.assign(inc.ctx,st.patch,{amount:st.amt,outflow24h:inc.ctx.outflow24h+st.amt});
      const a=incAssess(inc); inc.traj.push(a.score);
      const ev=txEvent(inc.acct,inc.inst,st.to,st.toInst,st.amt,"PENDING",{device:inc.ctx.deviceId});
      const d=decide(ev,a,inc.caseRef); inc.last={req:ev,res:d.res,lat:d.lat};
      const held=a.gate.hold;
      inc.txs.push({id:ev.transactionId,to:st.to,toInst:st.toInst,amt:st.amt,status:held?"HELD":"ALLOWED",t:stamp(),req:ev});
      pushStream({t:stamp(),src:inc.acct,inst:inc.inst,dst:st.to,amt:st.amt,score:a.score,band:a.band,status:held?"HELD":"ALLOWED",mode:"decision API",inc:inc.id});
      const top=a.contributions[0];
      if(held){
        inc.hold=true; inc.status="HOLD"; inc.holdAt=stamp(); inc.heldValue+=st.amt; inc.gateAt=stamp();
        tl(inc,"hold","Transfer <b>"+SGD(st.amt)+"</b> to "+st.to+" — gate tripped, <b>HOLD</b> returned before commit","RAPID_DRAIN");
        tl(inc,"policy","Policy gate applied <b>HOLD</b> to this and subsequent outflows");
        audit("SYSTEM","HOLD "+d.res.decisionId+" — "+a.drainPct.toFixed(1)+"% exceeds the 50% gate on protected account "+inc.acct,inc.id);
        toast("Hold active · "+disp(inc.acct,inc.inst),a.drainPct.toFixed(1)+"% of a protected balance crossed the 50% gate. "+SGD(st.amt)+" held before it moved.","crit");
        const first=inc.txs[0];
        timers.push(setTimeout(()=>{S.dups++; inc.dupNote="Retry received with <span class='m'>"+ev.idempotencyKey+"</span> — duplicate suppressed, stored <b>HOLD</b> "+d.res.decisionId+" returned. No second hold, no double count.";
          audit("SYSTEM","duplicate suppressed by idempotency key "+ev.idempotencyKey+" — stored "+d.res.decisionId+" returned",inc.id); refresh(inc.id)},reduced?100:900));
        timers.push(setTimeout(()=>{if(!first)return; S.life++; inc.lifeNote="Lifecycle update: <span class='m'>"+first.id+"</span> SETTLED ("+SGD(first.amt)+"). Same transactionId → projection updated, effectiveAmount unchanged. Counted once, not twice.";
          audit("SYSTEM","lifecycle SETTLED for "+first.id+" — projection updated, outflow counted once",inc.id); refresh(inc.id)},reduced?200:1800));
      } else {
        tl(inc,"tx","Transfer <b>"+SGD(st.amt)+"</b> to "+st.to+" — scored "+a.score+", <b>ALLOW</b>",top?top.code:null);
      }
    }
  } else if(st.kind==="policy"){
    tl(inc,"policy",st.label);
    if(/notification/i.test(st.label)&&inc.hold){inc.notified=true;audit("SYSTEM","customer notification sent for "+inc.acct,inc.id)}
    if(/Audit/.test(st.label)) audit("SYSTEM","audit event recorded for "+inc.id,inc.id);
  }
  if(i===total-1) finishSimulation(inc);
  save(); refresh(inc.id,st.kind==="tx"&&inc.hold&&inc.gateAt===stamp());
}
function finishSimulation(inc){
  const a=incAssess(inc);
  if(!inc.hold) inc.status=a.handling==="Review required"?"REVIEW":a.handling==="Monitor"?"MONITOR":"CLEARED";
  S.running=null;
  if(!inc.hold) toast(inc.status==="REVIEW"?"Review required":inc.status==="MONITOR"?"Added to monitoring":"No action needed",
    disp(inc.acct,inc.inst)+" scored "+a.score+" ("+a.band.toLowerCase()+"). "+a.gate.why,inc.status==="REVIEW"?"warn":"");
  audit("SYSTEM","scenario complete — "+inc.id+" status "+inc.status,inc.id); save();
}

/* ---------------- network graph model (built from the incident's own events) ---------------- */
const DOWN=["ACC-55210","ACC-63914","ACC-71508","ACC-44817"];
function buildGraph(inc){
  const N=[],E=[],add=n=>{N.push(n);return N.length-1};
  const flagged=inc.scenario==="phishing"||inc.scenario==="mule";
  const s=add({id:inc.acct,k:"subject",inst:inc.inst,x:.07,y:.5,tx:inc.txs.length+19,band:incAssess(inc).band,f:["Subject of "+inc.id]});
  let dev=-1;
  if(inc.sec.some(e=>e.eventType==="NEW_DEVICE")){ dev=add({id:inc.ctx.deviceId,k:"device",inst:"—",x:.22,y:.1,tx:null,band:"HIGH",f:["Network device relationship","First seen during this incident"]});
    E.push({a:dev,b:s,type:"Device session",amt:"—",sig:"NEW_DEVICE",src:inc.inst,ev:"AUTH_EVENT",ref:"—",link:"DIRECT",tm:inc.createdAt}) }
  const payees=[];
  inc.txs.forEach(t=>{if(!payees.find(p=>p.to===t.to)) payees.push({to:t.to,inst:t.toInst,amt:0,first:t}); payees.find(p=>p.to===t.to).amt+=t.amt});
  const P2=payees.slice(0,4), pIdx=[];
  P2.forEach((p,i)=>{
    const y=P2.length===1?.5:.18+i*(.66/(P2.length-1));
    const idx=add({id:p.to,k:flagged||i===P2.length-1?"mule":"acct",inst:p.inst,x:.31,y,tx:6+i*4,band:flagged?"HIGH":"ELEVATED",f:flagged?["Rapid fund movement"]:["Recently added beneficiary"]});
    pIdx.push(idx);
    E.push({a:s,b:idx,type:p.first.status==="HELD"&&inc.txs.filter(t=>t.to===p.to).every(t=>t.status==="HELD")?"Transfer (held)":"Transfer",amt:SGD(p.amt),sig:p.first.status==="HELD"?"RAPID_DRAIN":"—",
      src:inc.inst,ev:"PAYMENT_EVENT",ref:p.first.req?p.first.req.networkReference:"—",link:p.inst===inc.inst?"DIRECT":"NETWORK_REFERENCE",tm:p.first.t});
  });
  if(dev>=0&&pIdx.length){E.push({a:dev,b:pIdx[0],type:"Network device relationship",amt:"—",sig:"ENTITY_LINK",src:N[pIdx[0]].inst,ev:"NETWORK_DEVICE_RELATIONSHIP",ref:"—",link:"NETWORK_TOKEN",tm:"prior"});
    if(pIdx.length>2) E.push({a:dev,b:pIdx[pIdx.length-1],type:"Network device relationship",amt:"—",sig:"ENTITY_LINK",src:N[pIdx[pIdx.length-1]].inst,ev:"NETWORK_DEVICE_RELATIONSHIP",ref:"—",link:"NETWORK_TOKEN",tm:"prior"})}
  const cons=add({id:"ACC-88120",k:flagged?"mule":"acct",inst:inc.o2,x:.76,y:.52,tx:48,band:flagged?"CRITICAL":"ELEVATED",f:flagged?["Consolidation point","Linked to 3 flagged entities"]:["Receives from several accounts"]});
  const dIdx=[];
  pIdx.slice(0,3).forEach((pi,i)=>{
    const d=add({id:DOWN[i],k:flagged&&i!==1?"mule":"acct",inst:N[pi].inst,x:.54,y:.2+i*.3,tx:14+i*3,band:flagged&&i!==1?"HIGH":"LOW",f:flagged&&i!==1?["Repeated high-value transfers"]:[]});
    dIdx.push(d);
    E.push({a:pi,b:d,type:"Onward transfer",amt:SGD(Math.round(P2[i].amt*0.9/100)*100),sig:"—",src:N[pi].inst,ev:"PAYMENT_EVENT",ref:"—",link:"DIRECT",tm:"prior"});
    E.push({a:d,b:cons,type:"Consolidation",amt:SGD(Math.round(P2[i].amt*0.85/100)*100),sig:"—",src:i===1?inc.o2:N[d].inst,ev:i===1?"BENEFICIARY_MATCH":"PAYMENT_EVENT",
      ref:i===1?"—":"FAST-3H8P-77"+(19+i),link:i===1?"CORRELATED":(N[d].inst===inc.o2?"DIRECT":"NETWORK_REFERENCE"),tm:"prior"});
  });
  const bd=add({id:"UNOBSERVED",k:"boundary",inst:"—",x:.95,y:.52,tx:null,band:null,f:["Destination institution not participating","No valid linkage — hop not asserted"]});
  E.push({a:cons,b:bd,type:"Outbound transfer",amt:SGD(Math.round(inc.heldValue>0?inc.txs.reduce((s,t)=>s+t.amt,0)*1.3:inc.txs.reduce((s,t)=>s+t.amt,0))),sig:"—",src:inc.o2,ev:"PAYMENT_EVENT",ref:"—",link:"UNOBSERVED",tm:"prior"});
  const trace=pIdx.length?[s,pIdx[0],dIdx[0]!=null?dIdx[0]:pIdx[0],cons]:[s];
  return {N,E,trace:trace.filter((v,i,a)=>a.indexOf(v)===i),boundary:bd};
}

/* ---------------- Gemini investigation (simulated in this prototype) ---------------- */
function analyse(inc){
  const a=incAssess(inc), g=buildGraph(inc), k=disp(inc.acct,inc.inst);
  const hyp={phishing:"Behaviour is consistent with a phishing-driven account takeover and rapid-drain event. The session comes from a device never seen on this account, creates beneficiaries seconds before use, and moves "+a.drainPct.toFixed(1)+"% of a protected balance inside the 24-hour window.",
    mule:"Behaviour is consistent with a mule account: funds arrive from another institution and are forwarded within minutes to new beneficiaries linked to flagged entities. The account is below the protected threshold, so the rapid-drain safeguard does not apply; escalation relies on case handling.",
    smurf:"Behaviour is consistent with structuring: many small transfers to a recently added payee and repeat beneficiaries. Velocity is well above baseline, but at "+a.drainPct.toFixed(1)+"% the drain stays below the 50% gate, so no policy action is mandated.",
    replay:"Behaviour is consistent with credential replay: a password reset from an unrecognised session, an unseen device in a new country, then a single large transfer to a new payee. The drain is "+a.drainPct.toFixed(1)+"%, below the gate, so the case needs review rather than a policy hold."}[inc.scenario];
  const claims=a.contributions.map(c=>({text:c.label+" contributed <b>+"+c.points+"</b> — "+esc(c.detail),src:"assessment.contributions[] · "+c.code,code:c.code}));
  claims.push({text:"Opening balance "+SGD(a.balance)+"; "+SGD(a.outflow)+" moved in the 24-hour window ("+a.drainPct.toFixed(1)+"%).",src:"drain · DrainState",code:"RAPID_DRAIN"});
  if(inc.sec.length) claims.push({text:inc.sec.length+" account security event"+(inc.sec.length>1?"s":"")+" preceded the first transfer ("+inc.sec.map(e=>e.eventType).join(", ")+").",src:"security_events[]",code:"NEW_DEVICE"});
  claims.push({text:"The trace reaches "+(g.trace.length-1)+" observed hops across "+new Set(g.trace.map(i=>g.N[i].inst)).size+" institutions and stops at an unobserved boundary.",src:"neighbourhood · EdgeEvidence",code:"ENTITY_LINK"});
  const recs=inc.hold?["Keep the hold in place until the customer verifies or the 24h period ends","Contact the customer through a verified channel","Review the linked destination accounts","Escalate for cross-institution reporting"]
    :a.band==="CRITICAL"||a.band==="HIGH"?["Contact the customer through a verified channel","Review linked accounts and recent payees","Escalate if the customer does not confirm"]
    :["Keep the account under monitoring for 24 hours","Re-assess if outflow accelerates"];
  return {hyp,claims,recs,meta:{model:"gemini-3.5-flash",runtime:"simulated in prototype · Vertex AI in production",prompt:"inv-v3",schema:"CaseSummary-1.2",
    hash:tok("sha",inc.id+a.score+inc.timeline.length).slice(8),gen:"GEN-"+tok("g",inc.id+stamp()).slice(-6),at:stamp()}};
}

const tpsNow=()=>{const now=Date.now();S.tps=S.tps.filter(x=>now-x<5000);return (S.tps.length/5).toFixed(1)};

const hrow=(k,v,st)=>`<div class="hrow"><span class="dotst ${st||""}"></span><span>${k}</span><span class="v">${v}</span></div>`;
const logLi=e=>`<li><span class="t">${e.t}</span><span><b style="color:${e.actor==="ANALYST"?"var(--info)":e.actor==="CUSTOMER"?"var(--warn)":"var(--ink3)"}">${e.actor}</b>${esc(e.text)}</span></li>`;
function trajSvg(v){
  const W=320,H=120,pad=8,max=100,n=Math.max(2,v.length);
  const x=i=>pad+i*(W-pad*2)/(n-1), y=s=>H-pad-(s/max)*(H-pad*2);
  const pts=v.map((s,i)=>x(i)+","+y(s)).join(" ");
  const bands=[40,65,85].map(b=>`<line x1="0" x2="${W}" y1="${y(b)}" y2="${y(b)}" stroke="var(--ln)" stroke-dasharray="3 4"/>`).join("");
  const last=v[v.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Risk score trajectory, latest ${last}">${bands}
   <polyline points="${pts}" fill="none" stroke="${bandVar(band(last))}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
   ${v.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s)}" r="3" fill="${bandVar(band(s))}"/>`).join("")}</svg>`;
}
function towerLive(row){
  row.fresh=!reduced;
  const k=$("kTps"); if(k) k.textContent=tpsNow();
  if(S.ui.towerTab!=="stream"||!passFilter(row)) return;
  const list=$("streamList"); if(!list) return;
  const e=el("div"); e.innerHTML=srow(row); const node=e.firstElementChild;
  const emp=list.querySelector(".empty"); if(emp) emp.remove();
  list.insertBefore(node,list.firstChild); while(list.children.length>30) list.lastChild.remove();
  row.fresh=false;
}

  if(inc.verify==="SCAM"){gs="CANCELLED · SCAM CONFIRMED";why="Gate tripped at "+a.drainPct.toFixed(1)+"%. The customer confirmed the scam and cancelled; "+SGD(inc.heldValue)+" never left the account."}

      <div style="margin-left:auto;text-align:right"><div class="muted" style="font-size:11.5px">Advisory risk score</div>
        <div class="m" style="font-size:38px;font-weight:600;line-height:1;color:${bandVar(a.band)}">${mine?a.score:"—"}</div><span class="pill ${bandCls(a.band)}">${a.band}</span></div></div></section>
    <section class="gate ${gc}"><div class="cap">${I("shield")}Policy gate · SRF rapid drain<span class="pill ${hold?"p-crit":"p-mute"}">Mandatory control</span></div>
      <div class="state" style="${gcol?"color:"+gcol:""}"><span class="lk">${I(hold&&!inc.verify?"lock":inc.verify==="RELEASED"?"unlock":"shield")}</span>${gs}</div>
      <div class="why">${esc(why)}</div>
      <div class="facts"><div>Drain vs gate<b style="color:${a.drainPct>50?"var(--crit)":"inherit"}">${a.drainPct.toFixed(1)}% / 50%</b></div><div>Protected<b>${a.isProtected?"Yes":"No"}</b></div>
        <div>Opening balance<b>${SGD(a.balance)}</b></div><div>${inc.hold?"Auto-release":"Outflow 24h"}<b>${inc.hold?inc.holdAt+" +24h":SGD(a.outflow)}</b></div></div>
      ${meter(a)}</section>
    <div class="muted" style="font-size:12.5px;padding:0 4px">${inc.hold?`Case handling: <span class="pill p-crit">Policy hold</span> · applied automatically by the gate, not by an analyst or the model.`:`Case handling: <span class="pill ${bandCls(a.band)}">${a.handling}</span> · advisory, set by the score band — not a policy action.`}</div>

function runAI(id){
  const inc=S.incidents[id]; if(!inc||S.gemDown) return;
  const steps=["Evidence bundle assembled","Account history retrieved","Device relationships correlated","Entity neighbourhood analysed","Reasoning over correlated evidence","Schema validation","Draft prepared"];
  const ul=$("pipe"), btn=$("aiRun"); if(btn) btn.disabled=true;
  if(ul) ul.innerHTML=steps.map(s=>`<li><span class="mk">◌</span>${s}</li>`).join("");
  audit("ANALYST","investigation opened on "+inc.acct,inc.id);
  let i=0;
  (function nxt(){
    if(ul){ if(i>0){ul.children[i-1].className="done";ul.children[i-1].firstChild.textContent="✓"} if(i<steps.length){ul.children[i].className="run";ul.children[i].firstChild.textContent="◉"} }
    if(i>=steps.length){ inc.ai=analyse(inc); tl(inc,"act","Gemini summary generated and schema-validated"); audit("SYSTEM","Gemini summary "+inc.ai.meta.gen+" validated for "+inc.id,inc.id); save(); if(route.name==="ws"&&route.id===id) render(); return }
    i++; setTimeout(nxt,reduced?60:320);
  })();
}

function traceSummary(done){

  const insts=new Set(G.trace.map(i=>G.N[i].inst).filter(x=>x!=="—")), last=G.N[G.trace[G.trace.length-1]];

  <section class="card"><div class="hd"><h2>About this prototype</h2></div><p class="muted" style="margin:0;font-size:13px;line-height:1.6">Designed as a multi-tenant platform; demonstrated as a single deployment on synthetic data. Institutions are generic, not real banks. COSMIC-inspired cross-institutional risk intelligence. The rule engine and policy gate run here in the browser; Gemini output is simulated in this prototype and produced on Vertex AI in the production design.<br><br><b style="color:var(--ink)">Rules decide. AI explains. Humans authorize.</b></p></section></div>`;
}

/* =====================================================================
   GRAPH CANVAS
   ===================================================================== */
let cv=null,cx=null,pts=[];
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function edgeBetween(i,j){return G.E.find(e=>(e.a===i&&e.b===j)||(e.a===j&&e.b===i))}
const mid=e=>{const a=pts[e.a],b=pts[e.b];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2-14}};
const qpt=(a,m,b,t)=>{const u=1-t;return{x:u*u*a.x+2*u*t*m.x+t*t*b.x,y:u*u*a.y+2*u*t*m.y+t*t*b.y}};
function mountGraph(){
  cv=$("graph"); if(!cv) return; cx=cv.getContext("2d"); pick={n:-1,e:-1}; traceT=-1; showBound=false;
  sizeCv(); cv.addEventListener("click",onGraphClick);
}
function sizeCv(){ if(!cv) return; const d=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight; cv.width=w*d; cv.height=h*d; cx.setTransform(d,0,0,d,0,0); drawG() }
window.addEventListener("resize",()=>{if(route.name==="net")sizeCv()});
function nodeLabel(n){return n.k==="boundary"?"UNOBSERVED":dshort(n.id,n.inst)}
function drawG(){
  if(!cv||!G) return;
  const w=cv.clientWidth,h=cv.clientHeight,px=40,py=28;
  pts=G.N.map(n=>({x:px+n.x*(w-px*2),y:py+n.y*(h-py*2),n}));
  cx.clearRect(0,0,w,h);
  const ln=cssv("--ink3"),crit=cssv("--crit"),info=cssv("--info"),warn=cssv("--warn"),ink=cssv("--ink"),ink3=cssv("--ink3"),sf=cssv("--sf2");
  G.E.forEach((e,i)=>{
    const a=pts[e.a],b=pts[e.b],m=mid(e),hot=e.sig!=="—",unob=e.link==="UNOBSERVED";
    cx.beginPath();cx.moveTo(a.x,a.y);cx.quadraticCurveTo(m.x,m.y,b.x,b.y);
    if(unob||e.link==="CORRELATED") cx.setLineDash([4,4]);
    cx.strokeStyle=pick.e===i?info:unob&&showBound?warn:hot?crit:ln;
    cx.globalAlpha=pick.e===i?1:hot?.75:.45; cx.lineWidth=pick.e===i?2.6:hot?1.8:1.2; cx.stroke(); cx.globalAlpha=1; cx.setLineDash([]);
  });
  if(traceT>=0){
    const seg=Math.floor(traceT),lt=traceT-seg;
    for(let s=0;s<G.trace.length-1&&s<=seg;s++){
      const e=edgeBetween(G.trace[s],G.trace[s+1]); if(!e) continue;
      const A=pts[e.a],B=pts[e.b],M=mid(e),fwd=e.a===G.trace[s],end=s<seg?1:lt;
      cx.beginPath(); for(let q=0;q<=24;q++){const tt=q/24*end,p=qpt(A,M,B,fwd?tt:1-tt);q?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y)}
      cx.strokeStyle=info;cx.lineWidth=3.2;cx.stroke();
      if(s===seg){const hp=qpt(A,M,B,fwd?lt:1-lt);cx.beginPath();cx.arc(hp.x,hp.y,5,0,6.283);cx.fillStyle=info;cx.fill()}
    }
  }
  pts.forEach((p,i)=>{
    const n=p.n,r=n.k==="subject"?12:n.k==="mule"?9:n.k==="boundary"?11:7.5;
    if(n.k==="boundary"){cx.beginPath();cx.arc(p.x,p.y,r,0,6.283);cx.setLineDash([3,3]);cx.strokeStyle=showBound?warn:ink3;cx.lineWidth=1.8;cx.stroke();cx.setLineDash([]);
      cx.font="600 10px 'IBM Plex Mono',monospace";cx.textAlign="center";cx.fillStyle=showBound?warn:ink3;cx.fillText("?",p.x,p.y+3.5)}
    else{const col=n.k==="subject"?info:n.k==="mule"?crit:n.k==="device"?warn:ink3;
      if(pick.n===i){cx.beginPath();cx.arc(p.x,p.y,r+8,0,6.283);cx.fillStyle=col;cx.globalAlpha=.2;cx.fill();cx.globalAlpha=1}
      if(n.k==="subject"){cx.beginPath();cx.arc(p.x,p.y,r+5,0,6.283);cx.strokeStyle=col;cx.globalAlpha=.35;cx.lineWidth=1.5;cx.stroke();cx.globalAlpha=1}
      cx.beginPath();cx.arc(p.x,p.y,r,0,6.283);cx.fillStyle=col;cx.fill();cx.lineWidth=2;cx.strokeStyle=sf;cx.stroke()}
    cx.font="500 10px 'IBM Plex Mono',monospace";cx.textAlign="center";
    cx.fillStyle=pick.n===i?ink:n.k==="boundary"&&showBound?warn:n.k==="subject"?info:ink3;
    cx.fillText(nodeLabel(n),p.x,n.k==="boundary"?p.y-r-7:p.y+r+14);
    if(n.inst!=="—"&&n.k!=="boundary"){cx.font="400 9px 'IBM Plex Sans',sans-serif";cx.fillStyle=ink3;cx.fillText("Bank "+n.inst,p.x,p.y+r+25)}
  });
}
function onGraphClick(ev){
  const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top; let bn=-1,bd=1e9;
  pts.forEach((p,i)=>{const d=(p.x-mx)**2+(p.y-my)**2;if(d<bd){bd=d;bn=i}});
  if(bd<=900){pick={n:bn,e:-1};drawG();showDetail(nodeHtml(G.N[bn],bn));return}
  let be=-1,bed=1e9; G.E.forEach((e,i)=>{const m=mid(e),d=(m.x-mx)**2+(m.y-my)**2;if(d<bed){bed=d;be=i}});
  if(bed<=1600){pick={n:-1,e:be};drawG();showDetail(edgeHtml(G.E[be]))}
}
function showDetail(html){
  const d=$("gdetail");
  if(d&&matchMedia("(min-width:960px)").matches&&S.ui.netTab==="graph") d.innerHTML=html; else openSheet(html);
}
const fr=(k,v)=>`<dt>${k}</dt><dd>${v}</dd>`;
function nodeHtml(n,i){
  const conn=G.E.filter(e=>e.a===i||e.b===i).length;
  if(n.k==="boundary") return `<div class="hd"><h2>Unobserved downstream</h2><span class="pill p-warn" style="margin-left:auto">Boundary</span></div>
    <dl class="dl">${fr("Last observed","Bank "+G.N[G.trace[G.trace.length-1]].inst)}${fr("Linkage","UNOBSERVED")}${fr("Hop asserted","No")}</dl>
    <p class="note">The last institution reported an outbound transfer to one that does not contribute events. SENTINEL shows the edge of what it can see instead of inventing the next hop.</p>`;
  const mine=n.inst==="—"||own(n.inst);
  return `<div class="hd"><h2 class="m">${esc(disp(n.id,n.inst))}</h2><span class="pill ${n.k==="mule"?"p-crit":n.k==="subject"?"p-info":n.k==="device"?"p-warn":"p-ok"}" style="margin-left:auto">${n.k==="mule"?"Flagged":n.k==="subject"?"Subject":n.k==="device"?"Device token":"Clear"}</span></div>
    <dl class="dl">${fr("Institution",n.inst==="—"?"network token":"Bank "+n.inst)}${fr("Connected entities",conn)}${mine?(n.tx!=null?fr("Transactions",n.tx):""):fr("Transactions","withheld")+fr("Risk band",n.band)}</dl>
    ${mine&&n.f.length?`<p class="note">${n.f.map(esc).join(" · ")}</p>`:""}${mine?"":`<p class="note">Network projection. Identity, history and indicators beyond the band stay with Bank ${n.inst}.</p>`}`;
}
function edgeHtml(e){
  const A=G.N[e.a],B=G.N[e.b],see=own(A.inst)||own(B.inst)||own(e.src);
  return `<div class="hd"><h2 class="m" style="font-size:13px">${esc(nodeLabel(A))} → ${esc(nodeLabel(B))}</h2>${e.sig!=="—"?`<span class="pill p-crit" style="margin-left:auto">${e.sig}</span>`:""}</div>
    <dl class="dl">${fr("Relationship",e.type)}${fr("Value",see?e.amt:"withheld")}${fr("Observed",e.tm)}</dl><div class="hr"></div>
    <div class="muted" style="font-size:12px;margin-bottom:6px">Why this line exists</div>
    <dl class="dl">${fr("Reported by","Bank "+e.src)}${fr("Evidence",e.ev)}${fr("Network reference",e.ref)}${fr("Linkage",`<span style="color:${e.link==="UNOBSERVED"?"var(--warn)":e.link==="CORRELATED"?"var(--ink2)":"var(--ok)"}">${e.link}</span>`)}${fr("Tenant scope",own(e.src)?"OWN":"NETWORK")}${fr("Risk scoring",LINK_SCORING[e.link])}</dl>
    <p class="note">Read from the event record, not generated. Model involvement: none.</p>`;
}
function traceFunds(){
  if(!G||!cv) return; cancelAnimationFrame(raf); pick={n:-1,e:-1}; showBound=false;
  const inc=S.incidents[S.ui.netInc], segs=G.trace.length-1, start=performance.now(), dur=reduced?300:2200;
  audit("ANALYST","fund trace requested from "+dshort(inc.acct,inc.inst),inc.id);
  (function tick(now){
    const p=clamp((now-start)/dur,0,1); traceT=Math.min(p*segs,segs-0.0001); drawG();
    if(p<1) raf=requestAnimationFrame(tick);
    else{showBound=true;drawG();const d=$("gdetail");if(d)d.outerHTML=traceSummary(true);
      audit("SYSTEM","trace ended at observed boundary — Bank "+G.N[G.trace[G.trace.length-1]].inst,inc.id)}
  })(start);
}

   ===================================================================== */
function openSheet(html){$("sheet").innerHTML=`<div class="grab"></div>`+html+`<button class="btn block ghost" style="margin-top:14px" data-act="close">Close</button>`;$("sheet").classList.add("on");$("scrim").classList.add("on");setTimeout(()=>{const b=$("sheet").querySelector("button");if(b)b.focus()},50)}
function closeSheet(){$("sheet").classList.remove("on");$("scrim").classList.remove("on")}
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function evidenceSheet(code){
  const inc=(route.name==="inc"||route.name==="ws")&&S.incidents[route.id]; if(!inc) return;
  const a=incAssess(inc), c=a.contributions.find(x=>x.code===code), src=inc.timeline.find(e=>e.code===code);
  const f=(k,v)=>`<div class="field"><span>${k}</span><span>${esc(v)}</span></div>`;
  openSheet(`<h3>Evidence · <span class="m">${code}</span></h3><p class="muted" style="margin:0 0 10px;font-size:12.5px">The same object the screen rendered and Gemini received.</p>
   ${c?`<div class="muted" style="font-size:11.5px;margin-top:6px">assessment.contributions[] where code = ${code}</div>${f("label",c.label)}${f("points",c.points)}${f("max",c.max)}${f("detail",c.detail)}`:`<p class="muted">No points from this rule at present.</p>`}
   <div class="muted" style="font-size:11.5px;margin-top:10px">drain · DrainState</div>${f("balanceAtWindowStart",SGD(a.balance))}${f("outflow24h",SGD(a.outflow))}${f("drainPct",a.drainPct.toFixed(1))}${f("protected",String(a.isProtected))}${f("thresholdMet",String(a.gate.hold))}
   <div class="muted" style="font-size:11.5px;margin-top:10px">source and provenance</div>${f("triggering event",src?src.t+" · "+src.html.replace(/<[^>]+>/g,""):"standing account state")}${f("producer","rule engine "+RULESET)}${f("mutable by model","false")}`);
}
function rowSheet(id){
  const r=S.stream.find(x=>x.id===id); if(!r) return;
  if(r.inc&&S.incidents[r.inc]){ go("#/"+(own(r.inst)?"inc":"ws")+"/"+r.inc); return }
  const ev=txEvent(r.src,r.inst,r.dst,r.inst,r.amt,r.status==="ALLOWED"?"PENDING":"SETTLED",{txId:"TX-"+(80000+id)}); S.seqN--; S.seq[r.src]--;
  openSheet(`<h3>${esc(dshort(r.src,r.inst))} → ${esc(r.dst)}</h3><p class="muted" style="margin:0 0 8px;font-size:12.5px">${r.t} · Bank ${r.inst} · ${r.mode} · ${r.status.toLowerCase()}</p>
    <dl class="dl">${fr("Amount",SGD(r.amt))}${fr("Advisory score",r.score+" · "+r.band.toLowerCase())}${fr("Policy gate","not triggered")}</dl>
    <div class="muted" style="font-size:12px;margin:12px 0 6px">Canonical event as received — identifiers tokenised</div><pre class="code">${jsonHtml(ev)}</pre>
    ${r.inst==="B"?`<p class="note">Bank B contributes by event stream, so SENTINEL scores this after settlement. It can monitor, not prevent.</p>`:r.inst==="C"?`<p class="note">Bank C contributes daily batch files for backfill and reconciliation.</p>`:`<p class="note">Bank A asks before it moves money: this payment was scored and allowed before commit.</p>`}`);
}

function setTenant(k){ if(S.tenant===k) return closeSheet(); S.tenant=k; closeSheet(); audit("ANALYST","signed in as "+TENANTS[k].name+" — cross-tenant fields masked, own accounts in full"); save(); render(); toast("Signed in as "+TENANTS[k].name,"Other institutions' accounts now appear masked.","") }
function tenantSheet(){
  openSheet(`<h3>Switch institution</h3><p class="muted" style="margin:0 0 12px;font-size:12.5px">Same product and codebase; each bank sees its own records in full and others' as masked projections.</p>
   <div class="tcards">${["A","B","C"].map(k=>`<button class="tcard" data-act="tenant" data-arg="${k}" aria-pressed="${S.tenant===k}"><div style="display:flex;gap:9px;align-items:center"><span class="tmark" style="background:${TENANTS[k].mark}">${k}</span><div><b>${TENANTS[k].name}</b><div class="muted" style="font-size:12px">${TENANTS[k].city}</div></div></div></button>`).join("")}</div>`);
}
function verifySheet(inc){
  openSheet(`<h3>Customer contacted</h3><p class="muted" style="margin:0 0 12px;font-size:13px">Waiting for the customer's answer through a verified channel. In this prototype you play the customer's response; in production it comes from the bank's verification system.</p>
    <button class="btn danger block" data-act="vscam" data-arg="${inc.id}">${I("x")}Customer confirms it's a scam — cancel transfers</button>
    <button class="btn block" style="margin-top:8px" data-act="vok" data-arg="${inc.id}">${I("check")}Customer verifies the transfers as their own</button>`);
}
const ACT={
 close:closeSheet, tenant:k=>setTenant(k), bell:()=>go("#/inv"),
 ttab:k=>{S.ui.towerTab=k;render()}, filter:k=>{S.ui.filter=k;render()}, row:id=>rowSheet(+id),
 scen:k=>{S.sim.scenario=k;save();render()}, speed:s=>{S.sim.speed=+s;save();render()}, opt:k=>{S.sim.opts[k]=!S.sim.opts[k];save();render()}, run:()=>runSimulation(),
 ev:c=>evidenceSheet(c), wstab:k=>{S.ui.wsTab=k;render()}, airun:id=>runAI(id),
 mkcase:id=>{const c=createCase(S.incidents[id]);toast("Case opened",c.id+" drafted from the recorded evidence.","ok");go("#/case/"+c.id)},
 netinc:id=>{S.ui.netInc=id;render()}, nettab:k=>{S.ui.netTab=k;render()}, trace:()=>traceFunds(),
 casef:k=>{S.ui.caseFilter=k;render()},
 csign:id=>{const c=S.cases[id];c.signed=true;c.status="ESCALATED";audit("ANALYST","case "+id+" signed off and escalated",c.incId);save();render();toast("Case escalated",id+" sent for enhanced investigation.","ok")},
 cclose:arg=>{const [id,st]=arg.split("|"),c=S.cases[id];c.status=st;c.signed=true;const inc=c.incId&&S.incidents[c.incId];
   if(inc&&!["CANCELLED","RELEASED"].includes(inc.status)&&!inc.hold) inc.status="CLEARED";
   audit("ANALYST","case "+id+" closed — "+caseLabel(st).toLowerCase(),c.incId);save();render();toast("Case closed",caseLabel(st)+".","ok")},
 ccopy:id=>{const c=S.cases[id],inc=c.incId&&S.incidents[c.incId];
   const txt=["SENTINEL AI — "+c.id,c.title,"Subject: "+disp(c.acct,c.inst),"Severity: "+c.band+" · score "+c.score,"Policy gate: "+c.gate,"Value held: "+(c.heldValue?SGD(c.heldValue):"—"),
     inc&&inc.ai?"Summary: "+inc.ai.hyp:"",inc?"Timeline:\n"+inc.timeline.map(e=>e.t+" "+e.html.replace(/<[^>]+>/g,"")).join("\n"):"","Rules decide. AI explains. Humans authorize."].filter(Boolean).join("\n");
   (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copied","Report text is on your clipboard.","ok"),()=>openSheet(`<h3>Report text</h3><pre class="code" style="white-space:pre-wrap">${esc(txt)}</pre>`))},
 contact:()=>{const inc=S.incidents[route.id];if(!inc)return;audit("ANALYST","customer contacted for "+inc.acct+" through a verified channel",inc.id);tl(inc,"act","Customer contacted — verification requested");save();
   if(inc.hold&&!inc.verify){inc.verify="REQUESTED";verifySheet(inc)} else if(inc.hold&&inc.verify==="REQUESTED") verifySheet(inc); else {render();toast("Customer contacted","Verification requested for "+inc.acct+".","")}},
 vscam:id=>{const inc=S.incidents[id];inc.verify="SCAM";inc.status="CANCELLED";closeSheet();tl(inc,"act","Customer confirmed scam — held transfers <b>cancelled</b>");
   audit("CUSTOMER","confirmed scam — "+SGD(inc.heldValue)+" in held transfers cancelled",inc.id);save();render();toast("Transfers cancelled","The customer confirmed the scam. "+SGD(inc.heldValue)+" never left the account.","ok")},
 vok:id=>{const inc=S.incidents[id];inc.verify="VERIFIED";closeSheet();tl(inc,"act","Customer <b>verified</b> with the bank — release unlocked");audit("CUSTOMER","verified the held transfers — expedited release permitted",inc.id);save();render()},
 release:()=>{const inc=S.incidents[route.id];if(!inc||inc.verify!=="VERIFIED")return;inc.verify="RELEASED";inc.status="RELEASED";tl(inc,"act","Expedited release after customer verification — reason SG-RD-50_CUSTOMER_VERIFIED");
   audit("ANALYST","expedited release on "+inc.acct+" after customer verification — reason SG-RD-50_CUSTOMER_VERIFIED",inc.id);save();render();toast("Released after verification","Recorded with the analyst's identity and reason code.","ok")},
 kill:()=>{const inc=S.incidents[route.id];if(!inc)return;openSheet(`<h3>Engage kill switch?</h3><p class="muted" style="font-size:13px;margin:0 0 12px">Holds every eligible outflow on ${esc(inc.acct)} until the customer verifies. This is logged against your analyst identity.</p><button class="btn danger block" data-act="killok" data-arg="${inc.id}">${I("kill")}Hold all outflows</button>`)},
 killok:id=>{const inc=S.incidents[id];inc.killed=true;closeSheet();tl(inc,"act","Kill switch — all eligible outflows held pending verification");audit("ANALYST","kill switch engaged on "+inc.acct,inc.id);save();render();toast("Kill switch engaged","All eligible outflows on "+inc.acct+" are held.","crit")},

   toast(S.gemDown?"Intelligence path down":"Gemini restored",S.gemDown?"Decisions and holds continue. Investigations queue until the model returns.":"Investigations are available again.",S.gemDown?"warn":"ok")},

/* =====================================================================
   BOOT
   ===================================================================== */
const _push=pushStream; let rowId=0;
pushStream=function(row){row.id=++rowId;_push(row)};
function boot(){
  const had=load();
  S.running=null; S.stream=[]; S.tps=[];
  seedCases();
  if(!had) audit("SYSTEM","surveillance active — 3 institutions connected: A decision API, B event stream, C batch");
  // stale "LIVE" incidents from an interrupted run
  Object.values(S.incidents).forEach(i=>{if(i.status==="LIVE") i.status=i.hold?"HOLD":"REVIEW"});
  for(let i=0;i<24;i++) baseline();
  parse(); render();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render());
  new MutationObserver(()=>{applyTheme();if(route.name==="net")drawG()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  window.addEventListener("hashchange",()=>{parse();closeSheet();render();window.scrollTo(0,0)});
  setInterval(()=>{t0=new Date(t0.getTime()+1000);$("clock").textContent=stamp()+" SGT";const k=$("kTps");if(k)k.textContent=tpsNow()},1000);
  $("clock").textContent=stamp()+" SGT";
  setInterval(baseline,850);
  setInterval(batchC,19000);
}
boot();
})();
