# WebSocket gateway: its own deployable because its scaling and connection lifecycle genuinely differ.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sentinel-stream
  labels:
    cloud.googleapis.com/location: __REGION__
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '__MIN_INSTANCES__'
        autoscaling.knative.dev/maxScale: '3'
        # Direct VPC egress: all outbound traffic leaves through Cloud NAT's one reserved IP, the only address on the
        # Atlas access list (never 0.0.0.0/0). Created by infra/cloud-build/scripts/bootstrap-project.sh.
        run.googleapis.com/network-interfaces: '[{"network":"__VPC_NETWORK__","subnetwork":"__VPC_SUBNET__"}]'
        run.googleapis.com/vpc-access-egress: all-traffic
        run.googleapis.com/sessionAffinity: 'true'
    spec:
      serviceAccountName: sentinel-stream@__PROJECT_ID__.iam.gserviceaccount.com
      # 60 minutes caps a WebSocket's lifetime; the client reconnects and resumes from the global cursor.
      timeoutSeconds: 3600
      containers:
        - image: __IMAGE__
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: MONGODB_DATABASE
              value: sentinel_ai
            - name: STREAM_ALLOWED_ORIGIN
              value: __UI_ORIGINS__
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-uri
                  key: latest
