<h1 class="sentinel-visually-hidden">Control Tower</h1>

<section class="kpis" aria-label="Headline figures">
  @for (kpi of facade.kpis(); track kpi.id) {
    <sentinel-kpi-card [kpi]="kpi" />
  }
</section>

<sentinel-live-global-network
  class="network"
  aria-labelledby="network-title"
  [scene]="facade.globeScene()"
  [callouts]="facade.globeCallouts()"
  [stats]="facade.networkStats()"
  [description]="globeDescription()"
  [selection]="facade.globeSelection()"
  [detail]="facade.globeDetail()"
  [bankFocus]="facade.bankFocusLabel()"
  (selectTarget)="facade.select($event)"
  (action)="facade.act($event)"
/>

<div class="lower">
  <sentinel-needs-attention class="surface" [items]="facade.needsAttention()" (open)="facade.act({ type: 'open-alert', accountId: $event })" />
  <sentinel-transaction-stream class="surface" [rows]="facade.streamRows()" />
  <sentinel-system-status class="surface" [rows]="facade.systemStatus()" />
</div>
