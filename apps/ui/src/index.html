<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SENTINEL AI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b10" />
    <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the remembered theme before the first paint (see core/theme/theme-preferences.ts). Presentation only.
      try {
        var brand = localStorage.getItem('sentinel.theme.brand');
        var appearance = localStorage.getItem('sentinel.theme.appearance');
        if (brand === 'bank-a' || brand === 'bank-b' || brand === 'bank-c') document.documentElement.setAttribute('data-tenant-theme', brand);
        if (appearance === 'light') document.documentElement.setAttribute('data-appearance', 'light');
      } catch (error) {}
    </script>
  </head>
  <body>
    <sentinel-root></sentinel-root>
  </body>
</html>
